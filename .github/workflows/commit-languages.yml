name: Gerar gráfico de linguagens por commit

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [beta, main]
    paths:
      - "scripts/commit_languages.py"
      - ".github/workflows/commit-languages.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar o gerador
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Gerar SVG a partir dos commits
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          COMMIT_AUTHOR: ${{ github.repository_owner }}
        run: python scripts/commit_languages.py dist

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
